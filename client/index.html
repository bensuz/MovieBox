<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />

        <!-- Defaults for crawlers and link unfurlers that don't run JavaScript.
             Each page replaces the title, description and canonical at runtime. -->
        <title>MovieBox · Discover movies and build your watchlist</title>
        <meta
            name="description"
            content="Discover popular, top rated and upcoming movies, watch trailers, and keep a personal watchlist. Powered by the TMDB catalog."
        />
        <link rel="canonical" href="https://moviebox-0lid.onrender.com/" />

        <meta name="theme-color" content="#08080c" />
        <meta name="color-scheme" content="dark" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />

        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="MovieBox" />
        <meta property="og:url" content="https://moviebox-0lid.onrender.com/" />
        <meta
            property="og:title"
            content="MovieBox · Discover movies and build your watchlist"
        />
        <meta
            property="og:description"
            content="Discover popular, top rated and upcoming movies, watch trailers, and keep a personal watchlist."
        />
        <meta
            property="og:image"
            content="https://moviebox-0lid.onrender.com/og-image.jpg"
        />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="MovieBox logo with the tagline: Discover movies. Keep the ones you love."
        />
        <meta name="twitter:card" content="summary_large_image" />

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebSite",
                "name": "MovieBox",
                "url": "https://moviebox-0lid.onrender.com/",
                "potentialAction": {
                    "@type": "SearchAction",
                    "target": "https://moviebox-0lid.onrender.com/search/{search_term_string}",
                    "query-input": "required name=search_term_string"
                }
            }
        </script>

        <!-- Start the homepage data request in parallel with the JS bundle.
             The URL and credentials mode must match the app's fetch exactly. -->
        <link
            rel="preload"
            as="fetch"
            href="/api/publicmovies/public?category=popular&page=1"
            crossorigin="use-credentials"
        />
        <link rel="preconnect" href="https://image.tmdb.org" />
        <link
            rel="preload"
            as="font"
            type="font/woff2"
            href="/node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2"
            crossorigin
        />
    </head>
    <body>
        <div id="root">
            <!-- Painted as soon as the CSS arrives, before the JS bundle runs.
                 React replaces it with the real header on mount. -->
            <header
                class="fixed inset-x-0 top-0 z-40 border-b border-transparent bg-linear-to-b from-ink-950/80 to-transparent bg-origin-border"
            >
                <div class="shell flex h-16 items-center">
                    <span class="inline-flex items-center gap-2.5">
                        <svg viewBox="0 0 32 32" class="size-8" aria-hidden="true">
                            <defs>
                                <linearGradient id="shell-g" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#FF6B7A" />
                                    <stop offset="1" stop-color="#D11F37" />
                                </linearGradient>
                                <clipPath id="shell-c"><rect width="32" height="32" rx="9" /></clipPath>
                            </defs>
                            <rect width="32" height="32" rx="9" fill="url(#shell-g)" />
                            <g clip-path="url(#shell-c)">
                                <rect width="32" height="10" fill="#08080C" fill-opacity=".28" />
                                <path d="M2 0h4.5l4 10H6zM12.5 0H17l4 10h-4.5zM23 0h4.5l4 10H27z" fill="#fff" fill-opacity=".92" />
                            </g>
                            <path d="M13.5 16.2v9.6c0 .8.9 1.3 1.6.9l7.7-4.8c.6-.4.6-1.3 0-1.7l-7.7-4.8c-.7-.4-1.6.1-1.6.9Z" fill="#fff" />
                        </svg>
                        <span class="font-display text-xl font-extrabold tracking-tight text-ink-50">
                            Movie<span class="text-brand-500">Box</span>
                        </span>
                    </span>
                </div>
            </header>
        </div>
        <noscript>
            <p style="padding: 2rem; font-family: system-ui, sans-serif">
                MovieBox needs JavaScript to browse movies and manage your list.
            </p>
        </noscript>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
